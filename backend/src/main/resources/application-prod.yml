spring:
  datasource:
    # 한글 깨짐 방지(characterEncoding)와 SSL 경고 제거 옵션 추가
    # Docker 컨테이너 네트워크 내에서는 'db' 서비스 이름을 사용해야 합니다.
    url: jdbc:mysql://db:3306/${DATABASE_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  logging:
    level:
      root: INFO
      com.ondongne.backend: INFO
      org.springframework.web: INFO
      org.hibernate: WARN
      org.hibernate.SQL: INFO
      com.zaxxer.hikari: WARN

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: ${FRONTEND_URL:https://quizai.co.kr}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

