spring:
  datasource:
    # 한글 깨짐 방지(characterEncoding)와 SSL 경고 제거 옵션 추가
    # Docker 컨테이너 네트워크 내에서는 'db' 서비스 이름을 사용해야 합니다.
    url: jdbc:mysql://db:3306/${DATABASE_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 120s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:https://quizai.co.kr}/login/oauth2/code/{registrationId}"
          # TODO: Kakao OAuth 지원 시 운영 redirect URI를 활성화합니다.
          # kakao:
          #   redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:https://quizai.co.kr}/login/oauth2/code/{registrationId}"

  logging:
    level:
      root: INFO
      com.quizAi.backend: INFO
      org.springframework.web: INFO
      org.hibernate: WARN
      org.hibernate.SQL: INFO
      com.zaxxer.hikari: WARN

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: ${FRONTEND_URL:https://quizai.co.kr}
  auth:
    jwt-secret: ${JWT_SECRET_KEY}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
