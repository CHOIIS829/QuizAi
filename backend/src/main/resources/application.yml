server:
  port: 8080

spring:
  application:
    name: quiz-ai
  profiles:
    default: local

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:test-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:test-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 3. File Upload Limits
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

# 4. Monitoring (Actuator & Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# 5. Custom Application Properties
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  auth:
    jwt-secret: ${JWT_SECRET_KEY:quizai-default-jwt-secret-key-1234567890}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:1800}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:86400}
    access-cookie-name: ${ACCESS_COOKIE_NAME:quizai_access_token}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:quizai_refresh_token}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-flash-latest

  file:
    temp-dir: ./temp/video

  yt-dlp:
    path: ${YT_DLP_PATH:yt-dlp}

  rate-limit:
    quiz-generate:
      limit: ${QUIZ_GENERATE_LIMIT:10}
      window-seconds: ${QUIZ_GENERATE_WINDOW_SECONDS:600}
