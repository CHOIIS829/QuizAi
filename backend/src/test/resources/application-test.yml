spring:
  datasource:
    url: jdbc:h2:mem:quizai;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password: test-redis-password

app:
  frontend-url: http://localhost:3000
  auth:
    jwt-secret: quizai-test-jwt-secret-key-with-at-least-32-bytes
  gemini:
    api-key: test-gemini-key
