name: quizai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      VCS_REF: ${IMAGE_REVISION:-local}
      BUILD_DATE: ${IMAGE_BUILD_DATE:-unknown}
  image: ${BACKEND_IMAGE:-quizai-backend:local}
  restart: always
  logging: *default-logging
  environment:
    SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DATABASE_NAME:?DATABASE_NAME is required}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
    SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
    # TODO: Kakao OAuth 지원 시 아래 환경 변수를 활성화합니다.
    # KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
    # KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    FRONTEND_URL: ${FRONTEND_URL:-https://quizai.co.kr}
    OAUTH2_REDIRECT_BASE_URL: ${OAUTH2_REDIRECT_BASE_URL:-https://quizai.co.kr}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    SPRING_PROFILES_ACTIVE: prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - quiz-net
  volumes:
    - quiz-video-data:/app/temp/video
  stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-130s}
  mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
  cpus: ${BACKEND_CPU_LIMIT:-1.5}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-frontend-common: &frontend-common
  build:
    context: ./frontend
    args:
      VCS_REF: ${IMAGE_REVISION:-local}
      BUILD_DATE: ${IMAGE_BUILD_DATE:-unknown}
  image: ${FRONTEND_IMAGE:-quizai-frontend:local}
  restart: always
  logging: *default-logging
  networks:
    - quiz-net
  mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
  cpus: ${FRONTEND_CPU_LIMIT:-0.5}
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s

services:
  backend-blue:
    <<: *backend-common
    container_name: quizAi-backend-blue
    ports:
      - "127.0.0.1:8090:8080"

  backend-green:
    <<: *backend-common
    container_name: quizAi-backend-green
    ports:
      - "127.0.0.1:8091:8080"

  frontend-blue:
    <<: *frontend-common
    container_name: quizAi-frontend-blue

  frontend-green:
    <<: *frontend-common
    container_name: quizAi-frontend-green

  gateway:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: quizAi-gateway
    restart: always
    logging: *default-logging
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-90}:8080"
    volumes:
      - ./gateway/nginx:/etc/nginx/conf.d:ro
      - ./.deploy-state/nginx:/etc/nginx/runtime:ro
    networks:
      - quiz-net
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-256m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway-healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  db:
    image: mysql:8.0@sha256:99d774bf02a48a1bb1c599920d2571946d31e5940b854b02737d5e95c184358f
    container_name: quizAi-db
    restart: always
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DATABASE_NAME:?DATABASE_NAME is required}
      MYSQL_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - quiz-db-data:/var/lib/mysql
    networks:
      - quiz-net
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1g}
    cpus: ${MYSQL_CPU_LIMIT:-1.5}

  redis:
    image: redis:alpine@sha256:fd83658b0e40e2164617d262f13c02ca9ee9e1e6b276fd2fa06617e09bd5c780
    container_name: quizAi-redis
    restart: always
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - quiz-net
    volumes:
      - quiz-redis-data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.75}

networks:
  quiz-net:
    driver: bridge

volumes:
  quiz-db-data:
  quiz-video-data:
  quiz-redis-data:
