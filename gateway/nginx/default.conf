map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $proxy_forwarded_proto $proxy_default_forwarded_port {
    https 443;
    http 80;
    default $server_port;
}

map $http_x_forwarded_port $proxy_forwarded_port {
    default $http_x_forwarded_port;
    "" $proxy_default_forwarded_port;
}

map $http_cf_connecting_ip $trusted_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/runtime/backend-url.inc;
    include /etc/nginx/runtime/frontend-url.inc;

    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api {
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location /oauth2/ {
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location /login/oauth2/ {
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location / {
        proxy_pass $frontend_url$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }
}
