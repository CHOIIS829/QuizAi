name: Backup Production Database

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: quizai-home-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout backup scripts
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create compressed MySQL backup
        id: database_backup
        run: |
          chmod +x scripts/db-backup.sh
          BACKUP_RETENTION_DAYS=14 ./scripts/db-backup.sh

      - name: Store backup outside the server
        uses: actions/upload-artifact@v4
        with:
          name: quizai-mysql-${{ github.run_id }}
          path: ${{ steps.database_backup.outputs.backup_file }}
          if-no-files-found: error
          retention-days: 14
